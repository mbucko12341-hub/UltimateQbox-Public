<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>caticus-6radio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="radio-menu">
        <section id="radio-panel">
            <div class="heading">
                <span></span>
                <strong>RADIO</strong>
            </div>
            <div class="station-browser">
                <button id="previous" type="button" aria-label="Previous station">‹</button>
                <div id="station-list"></div>
                <button id="next" type="button" aria-label="Next station">›</button>
            </div>
            <div class="station-details">
                <h1 id="station-name">RADIO OFF</h1>
                <p id="station-genre">SILENCE</p>
                <small id="station-count">1 / 1</small>
            </div>
            <div class="controls"><span>←</span> CHANGE STATION <span>→</span></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
