<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi UI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app" style="display: none;">
        <div class="tablet-container">
            <div class="header">
                <h2><i class="fas fa-taxi"></i> Downtown Cab Co.</h2>
                <p>Select your destination</p>
                <button id="close-btn" class="close-btn"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="content">
                <div class="waypoint-card" id="btn-waypoint">
                    <div class="icon-box"><i class="fas fa-map-marker-alt"></i></div>
                    <div class="details">
                        <h3>Use GPS Waypoint</h3>
                        <p>Driver will follow your custom map marker.</p>
                    </div>
                </div>

                <div class="divider"><span>OR CHOOSE PRESET</span></div>

                <div id="destinations-list" class="destinations-grid">
                    <!-- Cards will be injected here by JS -->
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
